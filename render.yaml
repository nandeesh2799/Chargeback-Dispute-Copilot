services:
  - type: web
    name: chargeback-dispute-copilot
    env: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "uvicorn app.main:app --app-dir backend --host 0.0.0.0 --port $PORT"
    healthCheckPath: "/api/health"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: DISPUTE_SOURCE
        value: mock
      - key: LLM_PROVIDER
        value: fallback
