version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: chargeback-dispute-copilot
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - PORT=8000
      - HOST=0.0.0.0
      - DATABASE_URL=sqlite:///./copilot.db
      - DISPUTE_SOURCE=mock
      - LLM_PROVIDER=fallback
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
    restart: unless-stopped
